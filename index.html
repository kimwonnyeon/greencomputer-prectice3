<!doc<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>간단한 페이지 만들기3</title>
    <link rel="stylesheet" href="main.css">
  </head>

  <body id="home">
    <!-- 전체 레이아웃 -->
    <div class="wrap">

      <!-- 상단 -->
      <header>
        <!-- logo -->
        <a href="#" class="logo">☘Leafy</a>

        <!-- 메뉴 -->
        <nav>
          <a href="#">홈</a>
          <a href="#">소개</a>
          <a href="#">서비스</a>
          <a href="#">문의</a>
        </nav>
      </header>


      <!-- main -->
      <main>

        <!-- 배너 -->
        <div class="intro">
          <div class="intro-content">
            <h1>
              자연이 주는 여유로움,<br />
              더 나은 일상을 위해<br />
            </h1>

            <p>작은 변화가 모여</p>
            <p>더 특별한 일상을 만듭니다.</p>

          <!--배너 버튼-->
            <a href="#" class="intro-button">자세히 보기</a>
          </div>
        </div>


        <!-- 첫 번째 본문 -->
        <section id="about" class="content-section">
          <!-- 이미지영역 -->
          <div class="image-box">
            <img src="images/note.png" alt="노트북" />
          </div>

          <!-- 본문 -->
          <div class="section-text">
            <h2>편리한 서비스</h2>
            <p>사용자의 일상을 더 만족하게 만드는</p>
            <p>다양한 기능을 제공합니다.</p>
          </div>
        </section>


        <!-- 두 번째 본문 -->
        <section id="service" class="content-section reverse">
          <!-- 이미지영역 -->
          <div class="image-box">
            <img src="images/grow.png" alt="새싹" />
          </div>

          <!-- 본문 -->
          <div class="section-text">
            <h2>자연과 사람을 생각하는 마음으로</h2>
            <p>사용자의 일상을 더 만족하게 만드는</p>
            <p>더 나은 내일을 만들어 갑니다.</p>
          </div>
        </section>

      </main>


      <!-- 하단 -->
      <footer id="contact">
        <p>© 2026 Leafy. All rights reserved.</p>

        <nav>
          <a href="#">회사소개</a>
          <a href="#">서비스</a>
          <a href="#">개인정보 처리 방침</a>
          <a href="#">이용약관</a>
          <a href="#">사이트 맵</a>
        </nav>
      </footer>

    </div>
  </body>
</html>
